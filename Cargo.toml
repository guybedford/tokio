[workspace]
resolver = "2"
members = [
  "tokio",
  "tokio-macros",
  "tokio-test",
  "tokio-stream",
  "tokio-util",

  # Internal
  "benches",
  "examples",
  "stress-test",
  "tests-build",
  "tests-integration",
]

[patch.crates-io]
tokio = { path = "tokio" }
tokio-macros = { path = "tokio-macros" }
tokio-stream = { path = "tokio-stream" }
tokio-test = { path = "tokio-test" }
tokio-util = { path = "tokio-util" }
# emscripten support: mio's emscripten target (epoll fd exposed via `AsRawFd`
# for the runtime to arm `emscripten_epoll_set_callback` on) plus the
# emscripten `IovLen`/epoll fixes (socket2, libc).
# Remove once released upstream.
mio = { git = "https://github.com/guybedford/mio", branch = "emscripten" }
socket2 = { git = "https://github.com/rust-lang/socket2" }
libc = { git = "https://github.com/guybedford/libc", branch = "libc-0.2-emscripten" }

[workspace.metadata.spellcheck]
config = "spellcheck.toml"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(fuzzing)',
  'cfg(loom)',
  'cfg(mio_unsupported_force_poll_poll)',
  'cfg(tokio_allow_from_blocking_fd)',
  'cfg(tokio_internal_mt_counters)',
  'cfg(tokio_no_parking_lot)',
  'cfg(tokio_no_tuning_tests)',
  'cfg(tokio_unstable)',
  'cfg(target_os, values("cygwin"))',
] }
